name: Foundry Local Ruff fix

on:
  push:
    branches: [fix/foundry-local-static-catalog]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[foundry-local-ruff-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-static-catalog
      - name: Apply focused Ruff fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("src/llmcapa/registry.py")
          text = registry.read_text(encoding="utf-8")
          text = text.replace(
              "                except Exception as exc:  # noqa: BLE001\n",
              "                except Exception as exc:\n",
              1,
          )
          text = text.replace(
              '                    raise ValueError(f"catalog {filename} must contain a models list")\n',
              '                    raise TypeError(f"catalog {filename} must contain a models list")\n',
              1,
          )
          text = text.replace(
              '                        raise ValueError(\n                            f"catalog {filename} contains a non-object record"\n                        )\n',
              '                        raise TypeError(\n                            f"catalog {filename} contains a non-object record"\n                        )\n',
              1,
          )
          registry.write_text(text, encoding="utf-8")

          azure = Path("scripts/_update_azure_foundry.py")
          text = azure.read_text(encoding="utf-8")
          text = text.replace(
              "            parsed = datetime.strptime(text, fmt)\n",
              "            parsed = datetime.strptime(text, fmt)  # noqa: DTZ007\n",
              1,
          )
          azure.write_text(text, encoding="utf-8")

          for path in (registry, azure):
              content = path.read_bytes().decode("utf-8").replace("\r\n", "\n")
              path.write_bytes(content.replace("\n", "\r\n").encode("utf-8"))
          PY
      - name: Verify Black and Ruff
        run: |
          python -m pip install black ruff
          python -m black --check src/llmcapa/registry.py scripts/_update_azure_foundry.py
          python -m ruff check src/llmcapa/registry.py scripts/_update_azure_foundry.py
      - name: Commit focused fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llmcapa/registry.py scripts/_update_azure_foundry.py
          git commit -m "fix: satisfy Ruff on touched catalog files [foundry-local-ruff-fix]"
          git push origin HEAD:fix/foundry-local-static-catalog
