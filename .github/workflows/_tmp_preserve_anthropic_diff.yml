name: Temporary preserve Anthropic catalog diff

on:
  push:
    branches:
      - feat/claude-sonnet-5-5

permissions:
  contents: write

jobs:
  preserve-diff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/claude-sonnet-5-5
          fetch-depth: 0
      - name: Restore base bytes and insert only Sonnet 5.5
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('src/llmcapa/data/anthropic.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          model = next(m for m in current['models'] if m['model_id'] == 'claude-sonnet-5-5')

          base = subprocess.check_output([
              'git', 'show', 'origin/main:src/llmcapa/data/anthropic.json'
          ])
          nl = b'\r\n' if b'\r\n' in base else b'\n'
          marker = b'  "models": [' + nl
          if marker not in base:
              raise SystemExit('models marker not found in main catalog')

          rendered = json.dumps(model, ensure_ascii=False, indent=2)
          lines = rendered.splitlines()
          block = nl.join(('    ' + line).encode('utf-8') for line in lines)
          updated = base.replace(marker, marker + block + b',' + nl, 1)
          path.write_bytes(updated)
          PY
      - name: Commit minimal catalog diff
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/llmcapa/data/anthropic.json
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve minimal Anthropic catalog diff"
            git push origin HEAD:feat/claude-sonnet-5-5
          fi
