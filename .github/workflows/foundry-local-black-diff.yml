name: Foundry Local Black diff

on:
  push:
    branches: [fix/foundry-local-static-catalog]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-static-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install black
      - name: Show Black diff
        run: python -m black --diff src/llmcapa/registry.py scripts/_update_azure_foundry.py
