name: Temporary fix audio catalog normalization v2

on:
  push:
    branches:
      - fix/foundry-local-catalog-metadata

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-catalog-metadata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch audio inference and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_capability_normalizers.py')
          text = path.read_text(encoding='utf-8')

          old = '''    media_type = str(extra.get("media_model_type", "")).lower()\n    has_audio_in = bool(inputs & {"audio", "speech"})\n'''
          new = '''    media_type = str(extra.get("media_model_type", "")).lower()\n    tasks = {\n        str(task).lower().strip()\n        for task in extra.get("tasks", [])\n        if str(task).strip()\n    }\n    has_audio_in = bool(inputs & {"audio", "speech"})\n'''
          if old not in text:
              raise SystemExit('audio tasks insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        "supports_streaming": (\n            bool(record.get("supports_streaming"))\n            if record.get("supports_streaming") is not None\n            else None\n        ),\n'''
          new = '''        "supports_streaming": (\n            True\n            if record.get("supports_streaming") is True\n            or "streaming" in model_id\n            or "streaming" in media_type\n            or any("streaming" in task for task in tasks)\n            else None\n        ),\n'''
          if old not in text:
              raise SystemExit('audio streaming block not found')
          text = text.replace(old, new, 1)

          old = '''        token in model_id or token in media_type\n        for token in (\n            "transcrib",\n            "translat",\n            "speech-to-text",\n            "stt",\n            "asr",\n            "whisper",\n        )\n'''
          new = '''        token in model_id\n        or token in media_type\n        or any(token in task for task in tasks)\n        for token in (\n            "transcrib",\n            "translat",\n            "speech-to-text",\n            "speech-recognition",\n            "automatic-speech-recognition",\n            "stt",\n            "asr",\n            "whisper",\n        )\n'''
          if old not in text:
              raise SystemExit('audio transcription predicate not found')
          text = text.replace(old, new, 1)

          old = '''    old = dict(record.get("audio") or {})\n    merged = {**base, **old, **override}\n    merged["extra"] = {\n        **(base.get("extra") or {}),\n        **(old.get("extra") or {}),\n        **(override.get("extra") or {}),\n    }\n'''
          new = '''    old = dict(record.get("audio") or {})\n    old_is_inferred = old.get("status") == "inferred"\n    merged = (\n        {**old, **base, **override}\n        if old_is_inferred\n        else {**base, **old, **override}\n    )\n    merged["extra"] = (\n        {\n            **(old.get("extra") or {}),\n            **(base.get("extra") or {}),\n            **(override.get("extra") or {}),\n        }\n        if old_is_inferred\n        else {\n            **(base.get("extra") or {}),\n            **(old.get("extra") or {}),\n            **(override.get("extra") or {}),\n        }\n    )\n'''
          if old not in text:
              raise SystemExit('audio merge block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_capability_normalizers.py')
          body = tests.read_text(encoding='utf-8')
          addition = '''\n\ndef test_audio_catalog_task_drives_transcription_without_name_hint():\n    record = {\n        "provider": "foundry-local",\n        "model_id": "parakeet-tdt-0.6b-v2",\n        "input_modalities": ["audio"],\n        "output_modalities": ["text"],\n        "supports_streaming": False,\n        "extra": {"tasks": ["automatic-speech-recognition"]},\n    }\n\n    assert normalize_audio_record(record, checked_at="2026-09-29") is True\n    assert record["audio"]["transcription"] is True\n    assert record["audio"]["supports_streaming"] is None\n\n\ndef test_audio_streaming_hint_overrides_chat_only_false_for_inferred_block():\n    record = {\n        "provider": "foundry-local",\n        "model_id": "nemotron-speech-streaming-en-0.6b",\n        "input_modalities": ["audio"],\n        "output_modalities": ["text"],\n        "supports_streaming": False,\n        "extra": {"tasks": ["automatic-speech-recognition"]},\n        "audio": {\n            "accepts_audio_input": True,\n            "speech_understanding": True,\n            "supports_streaming": False,\n            "status": "inferred",\n            "checked_at": "2026-09-28",\n        },\n    }\n\n    assert normalize_audio_record(record, checked_at="2026-09-29") is True\n    assert record["audio"]["transcription"] is True\n    assert record["audio"]["supports_streaming"] is True\n\n\ndef test_documented_audio_streaming_value_remains_curated():\n    record = {\n        "provider": "test",\n        "model_id": "streaming-audio",\n        "input_modalities": ["audio"],\n        "output_modalities": ["text"],\n        "supports_streaming": True,\n        "audio": {\n            "accepts_audio_input": True,\n            "supports_streaming": False,\n            "status": "documented",\n            "checked_at": "2026-09-28",\n        },\n    }\n\n    normalize_audio_record(record, checked_at="2026-09-29")\n    assert record["audio"]["supports_streaming"] is False\n'''
          if 'test_audio_catalog_task_drives_transcription_without_name_hint' not in body:
              tests.write_text(body.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Re-normalize bundled Foundry Local audio metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts._capability_normalizers import normalize_audio_record

          path = Path('src/llmcapa/data/foundry_local.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          changed = 0
          for record in data.get('models', []):
              if normalize_audio_record(record, checked_at='2026-09-29'):
                  changed += 1
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Foundry Local audio records normalized: {changed}')
          PY
      - name: Validate focused changes
        run: |
          python -m pip install --upgrade black ruff pytest
          python -m pip install -e .
          python -m black scripts/_capability_normalizers.py tests/test_capability_normalizers.py
          python -m ruff check scripts/_capability_normalizers.py tests/test_capability_normalizers.py
          python -m pytest -q tests/test_capability_normalizers.py tests/test_foundry_local_static.py
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fix-audio-normalizer-v2.yml
          git add scripts/_capability_normalizers.py tests/test_capability_normalizers.py src/llmcapa/data/foundry_local.json
          git diff --cached --check
          git commit -m "fix: normalize Foundry Local ASR capabilities"
          git push
