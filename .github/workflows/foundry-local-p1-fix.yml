name: Foundry Local P1 fix

on:
  push:
    branches: [fix/foundry-local-static-catalog]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[foundry-local-p1-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-static-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Filter non-runnable parent assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scraper = Path("scripts/_update_foundry_local.py")
          text = scraper.read_text(encoding="utf-8")
          anchor = '''    metadata = (\n        variant_info.get("variantMetadata")\n        if isinstance(variant_info.get("variantMetadata"), dict)\n        else {}\n    )\n\n    name = str(properties.get("name") or "").strip()\n'''
          replacement = '''    metadata = (\n        variant_info.get("variantMetadata")\n        if isinstance(variant_info.get("variantMetadata"), dict)\n        else {}\n    )\n    device = str(metadata.get("device") or "").strip()\n    execution_provider = str(metadata.get("executionProvider") or "").strip()\n    if not metadata or not device or not execution_provider:\n        return None\n\n    name = str(properties.get("name") or "").strip()\n'''
          if anchor not in text:
              raise SystemExit("Foundry Local variant metadata anchor not found")
          text = text.replace(anchor, replacement, 1)
          scraper.write_text(text, encoding="utf-8")

          test = Path("tests/test_foundry_local_static.py")
          text = test.read_text(encoding="utf-8")
          addition = '''\n\ndef test_foundry_local_catalog_contains_only_runnable_variants() -> None:\n    models = llmcapa.list_models(provider="foundry-local")\n    for model in models:\n        variants = model.extra.get("variants", [])\n        assert variants\n        assert all(variant.get("device") for variant in variants)\n        assert all(variant.get("execution_provider") for variant in variants)\n'''
          if "test_foundry_local_catalog_contains_only_runnable_variants" not in text:
              text = text.rstrip() + addition + "\n"
          test.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate official Foundry Local snapshot
        run: python scripts/_update_foundry_local.py
      - name: Validate review fix
        run: |
          python -m pip install black ruff pytest
          python -m black scripts/_update_foundry_local.py tests/test_foundry_local_static.py
          python -m ruff check scripts/_update_foundry_local.py tests/test_foundry_local_static.py
          PYTHONPATH=src python -m pytest tests/test_foundry_local_static.py -q
      - name: Commit review fix and regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/_update_foundry_local.py src/llmcapa/data/foundry_local.json tests/test_foundry_local_static.py provider_update_log.md
          git commit -m "fix: exclude non-runnable Foundry Local parent assets [foundry-local-p1-fix]"
          git push origin HEAD:fix/foundry-local-static-catalog
