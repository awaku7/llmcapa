name: One-time Cloudflare capability regression repair
on:
  push:
    branches:
      - automation/catalog-refresh-42201846102
    paths:
      - .github/workflows/one-time-cloudflare-capability-repair-20261107.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quality and test tooling
        run: python -m pip install -e . pytest black ruff==0.17.2 beautifulsoup4
      - name: Restore official capability flags and verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          path = Path("scripts/_update_cloudflare_workers_ai.py")
          source = path.read_text(encoding="utf-8")
          bt = chr(96)
          def sub_once(old, new):
              global source
              assert source.count(old) == 1, (old[:90], source.count(old))
              source = source.replace(old, new)
          
          sub_once(
              '    marker = f"' + bt + '{model_id}' + bt + '"',
              '    marker = re.compile(rf"' + bt + '{re.escape(model_id)}' + bt + r'(?:\s+Copy)?")',
          )
          sub_once("line.strip() == marker", "marker.fullmatch(line.strip())")
          sub_once(
              '        label = _clean_markdown(cells[0]).casefold()',
              '        label = re.sub(r"\s*↗\s*", " ", _clean_markdown(cells[0])).strip().casefold()',
          )
          line = next(l for l in source.splitlines() if l.startswith('    model_id_match = re.search('))
          assert r'\s*$' in line
          sub_once(line, line.replace(r'\s*$', r'(?:\s+Copy)?\s*$'))
          sub_once(
              '    if model_id_match and model_id_match.group(1) != model_id:',
              '    if model_id_match is None:\n'
              '        raise ValueError(f"Model ID not found in official page: {model_ref[\'url\']}")\n'
              '    if model_id_match.group(1) != model_id:',
          )
          sub_once(
              '        # Both GPT-OSS pages explicitly document Function calling: Yes.\n'
              '        # The Markdown badge parser may miss their newer page layout.\n'
              '        or model_id in {"@cf/openai/gpt-oss-20b", "@cf/openai/gpt-oss-120b"}',
              '',
          )
          path.write_text(source, encoding="utf-8")
          
          tests = Path("tests/test_cloudflare_updater.py")
          append = r'''
          
          
          def test_official_markdown_copy_badges_and_linked_feature_table():
              """Model ID Copy and linked labels must preserve documented capabilities."""
              bt = chr(96)
              model_id = "@cf/google/gemma-4-26b-a4b-it"
              ref = {
                  "model_id": model_id,
                  "url": "https://developers.cloudflare.com/workers-ai/models/gemma-4-26b-a4b-it/index.md",
                  "summary": "Model",
              }
              for suffix in (" Copy", ""):
                  text = (
                      "# gemma-4-26b-a4b-it\n\n"
                      "Text Generation • Google\n\n"
                      "Model ID\n\n"
                      f"{bt}{model_id}{bt}{suffix}\n\n"
                      "- Cloudflare-hosted\n- Batch\n- Function calling\n"
                      "- Reasoning\n- Vision\n- Zero data retention\n\n"
                      "| Model Info | |\n| --- | --- |\n"
                      "| Function calling [↗](https://example.test) | Yes |\n"
                      "| Vision | Yes |\n"
                      "| Context Window [↗](https://example.test) | 256,000 tokens |\n"
                      "The OpenAI compatible endpoint is /v1/chat/completions.\n"
                  )
                  row = _UPDATER.parse_model_page(
                      ref, text, responses_model_slugs=set(), checked_at="2026-11-07"
                  )
                  assert row["supports_function_calling"] is True
                  assert row["supports_vision"] is True
                  assert row["supports_reasoning"] is True
                  assert row["input_modalities"] == ["text", "image"]
                  assert row["context_window"] == 256_000
                  assert row["extra"]["cloudflare_tags"] == [
                      "Cloudflare-hosted",
                      "Batch",
                      "Function calling",
                      "Reasoning",
                      "Vision",
                      "Zero data retention",
                  ]
          
          
          def test_missing_model_id_fails_instead_of_silently_dropping_capabilities():
              import pytest
              with pytest.raises(ValueError, match="Model ID not found"):
                  _UPDATER.parse_model_page(
                      {
                          "model_id": "@cf/example/model",
                          "url": "https://developers.cloudflare.com/workers-ai/models/model/index.md",
                      },
                      "# model\n\nText Generation • Example\n\n- Function calling\n- Vision\n",
                      responses_model_slugs=set(),
                      checked_at="2026-11-07",
                  )
          
          
          def test_bundled_cloudflare_preserves_documented_capability_badges():
              import json
              path = (
                  Path(__file__).resolve().parents[1]
                  / "src" / "llmcapa" / "data" / "cloudflare-workers-ai.json"
              )
              records = json.loads(path.read_text(encoding="utf-8"))["models"]
              by_id = {model["model_id"]: model for model in records}
              assert all(model["extra"]["cloudflare_tags"] for model in records)
              for model_id in (
                  "@cf/zai-org/glm-5.3",
                  "@cf/deepseek-ai/deepseek-v4.1-flash-1017",
                  "@cf/google/gemma-4-26b-a4b-it",
              ):
                  assert by_id[model_id]["supports_function_calling"] is True
                  assert "Function calling" in by_id[model_id]["extra"]["cloudflare_tags"]
              for model_id in (
                  "@cf/cloudflare/clairic",
                  "@cf/deepseek-ai/deepseek-v4.1-flash-1017",
                  "@cf/google/gemma-4-26b-a4b-it",
              ):
                  assert by_id[model_id]["supports_vision"] is True
                  assert "Vision" in by_id[model_id]["extra"]["cloudflare_tags"]
                  assert "image" in by_id[model_id]["input_modalities"]
              assert sum(bool(row["supports_function_calling"]) for row in records) >= 22
              assert sum(bool(row["supports_vision"]) for row in records) >= 16
          '''
          tests.write_text(tests.read_text(encoding="utf-8") + append, encoding="utf-8")
          
          sys.path.insert(0,"scripts")
          import _update_cloudflare_workers_ai as updater
          
          data_file = Path("src/llmcapa/data/cloudflare-workers-ai.json")
          data = json.loads(data_file.read_text(encoding="utf-8"))
          old = json.loads(subprocess.check_output(
              ["git","show","origin/main:src/llmcapa/data/cloudflare-workers-ai.json"], text=True
          ))
          by_baseline = {m["model_id"]:m for m in old["models"]}
          by_current = {m["model_id"]:m for m in data["models"]}
          assert len(by_baseline) == len(by_current) == 73
          
          from_docs = updater.fetch_catalog()
          by_docs = {m["model_id"]:m for m in from_docs}
          assert set(by_current) == set(by_docs), (
            sorted(set(by_current)-set(by_docs)),sorted(set(by_docs)-set(by_current))
          )
          assert all(m["extra"]["cloudflare_tags"] for m in from_docs)
          
          changed={}
          for m in data["models"]:
              published=by_docs[m["model_id"]]
              prior=by_baseline[m["model_id"]]
              for field in ("supports_function_calling","supports_vision"):
                  assert prior[field] is not True or published[field] is True, (m["model_id"],field)
                  if m[field] != published[field]:
                      changed[field] = changed.get(field,0) + 1
                  m[field] = published[field]
              m["extra"]["cloudflare_tags"] = published["extra"]["cloudflare_tags"]
              m["extra"]["batch_available"] = published["extra"]["batch_available"]
              m["extra"]["official_catalog_checked_at"] = published["extra"]["official_catalog_checked_at"]
              if published["supports_vision"] and "image" not in m["input_modalities"]:
                  m["input_modalities"].append("image")
          assert changed == {"supports_function_calling":20,"supports_vision":11}, changed
          assert sum(bool(m["supports_function_calling"]) for m in data["models"]) == 22
          assert sum(bool(m["supports_vision"]) for m in data["models"]) == 16
          data_file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("CLOUDFLARE_REPAIRED",changed,len(from_docs),flush=True)
          
          PY
          python -m black scripts/_update_cloudflare_workers_ai.py tests/test_cloudflare_updater.py
          python -m black --check scripts/_update_cloudflare_workers_ai.py tests/test_cloudflare_updater.py
          python -m ruff check scripts/_update_cloudflare_workers_ai.py tests/test_cloudflare_updater.py
          python -m pytest -q tests/test_cloudflare_updater.py tests/test_registry.py::test_cloudflare_workers_ai_catalog_and_aliases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-cloudflare-parser-audit-20261107.yml .github/workflows/one-time-cloudflare-capability-repair-20261107.yml
          git add scripts/_update_cloudflare_workers_ai.py tests/test_cloudflare_updater.py src/llmcapa/data/cloudflare-workers-ai.json
          git commit -m "fix: restore Cloudflare capabilities from current official badges"
          git push origin HEAD:refs/heads/automation/catalog-refresh-42201846102
