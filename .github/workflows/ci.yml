name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install --upgrade pip black ruff build
      - name: Black
        run: python -m black --check src tests 2>&1 | tee black.log
      - name: Ruff
        if: always()
        run: python -m ruff check src tests 2>&1 | tee ruff.log
      - name: Build
        if: always()
        run: python -m build 2>&1 | tee build.log
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            black.log
            ruff.log
            build.log
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
      - name: Compile
        if: always()
        run: python -m py_compile src/llmcapa/*.py tests/*.py 2>&1 | tee compile-${{ matrix.python-version }}.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.log
            pytest-${{ matrix.python-version }}.xml
            compile-${{ matrix.python-version }}.log
          if-no-files-found: ignore
