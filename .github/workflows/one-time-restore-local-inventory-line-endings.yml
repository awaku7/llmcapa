name: One-time preserve local updater CRLF
on:
  push:
    branches:
      - automation/catalog-refresh-42201846102
    paths:
      - .github/workflows/one-time-restore-local-inventory-line-endings.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest black ruff==0.17.2
      - name: Preserve original CRLF and revalidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in (Path("scripts/provider_updates/lmstudio.py"), Path("scripts/provider_updates/llama_cpp.py")):
              raw = path.read_bytes()
              assert b"\r\n" not in raw
              path.write_bytes(raw.replace(b"\n", b"\r\n"))
              assert path.read_bytes().count(b"\r\n") == raw.count(b"\n")
          print("CRLF_RESTORED")
          PY
          python -m black --check scripts/provider_updates/lmstudio.py scripts/provider_updates/llama_cpp.py tests/test_provider_inventory_refresh.py
          python -m ruff check scripts/provider_updates/lmstudio.py scripts/provider_updates/llama_cpp.py tests/test_provider_inventory_refresh.py
          python -m pytest -q tests/test_provider_inventory_refresh.py::test_local_inventory_overlay_update_keeps_new_and_previous_models tests/test_provider_inventory_refresh.py::test_local_inventory_legacy_json_update_remains_supported
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/provider_updates/lmstudio.py scripts/provider_updates/llama_cpp.py
          git rm -f .github/workflows/one-time-restore-local-inventory-line-endings.yml
          git commit -m "style: preserve local inventory writer CRLF line endings"
          git push origin HEAD:refs/heads/automation/catalog-refresh-42201846102
