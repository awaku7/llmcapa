name: Temporary format capability normalizer

on:
  push:
    branches:
      - fix/foundry-local-catalog-metadata

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-catalog-metadata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format only capability normalizer
        run: |
          python -m pip install --upgrade black
          python -m black scripts/_capability_normalizers.py
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-format-normalizer.yml
          git add scripts/_capability_normalizers.py
          git diff --cached --check
          git commit -m "style: format capability normalizer"
          git push
