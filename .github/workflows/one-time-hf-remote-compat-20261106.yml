name: One-time HF overlay refresh compatibility fix
on:
  push:
    branches:
      - refactor/compact-local-catalogs-20261106
    paths:
      - .github/workflows/one-time-hf-remote-compat-20261106.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e . black ruff pytest
      - name: Black, Ruff, regression and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          
          path = Path("src/llmcapa/registry.py")
          text = path.read_text(encoding="utf-8")
          old_cache = """                    payload = json.loads(text)
                              records = (
                                  payload.get("models", [])
                                  if isinstance(payload, dict)
                                  else payload
                              )
          """
          new_cache = """                    payload = json.loads(text)
                              if is_hf_overlay(payload):
                                  if self._hf_catalog_source is None:
                                      continue
                                  payload = expand_hf_overlay(self._hf_catalog_source, payload)
                              records = (
                                  payload.get("models", [])
                                  if isinstance(payload, dict)
                                  else payload
                              )
          """
          old_remote = """                payload = json.loads(text)
                          records = (
                              payload.get("models", []) if isinstance(payload, dict) else payload
                          )
          """
          new_remote = """                payload = json.loads(text)
                          if is_hf_overlay(payload):
                              source = self._hf_catalog_source
                              if source is None:
                                  resource = resources.files("llmcapa.data").joinpath("huggingface.json")
                                  source = json.loads(resource.read_text(encoding="utf-8"))
                              payload = expand_hf_overlay(source, payload)
                          records = (
                              payload.get("models", []) if isinstance(payload, dict) else payload
                          )
          """
          for old, new in ((old_cache, new_cache), (old_remote, new_remote)):
              assert text.count(old) == 1, f"expected one patch point; got {text.count(old)}"
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          
          tests = Path("tests/test_hf_overlay.py")
          code = tests.read_text(encoding="utf-8")
          assert "test_remote_overlay_refresh_support" not in code
          code += """
          
          def test_remote_overlay_refresh_support(tmp_path, monkeypatch):
              import json
              from io import BytesIO
          
              from llmcapa.registry import Registry
          
              monkeypatch.setenv("HOME", str(tmp_path))
              monkeypatch.setenv("USERPROFILE", str(tmp_path))
              registry = Registry()
              registry._ensure_loaded()
              source = _source()
              registry._hf_catalog_source = source
              payload = pack_hf_overlay(source, _local("vllm"), provider="vllm")
              raw = json.dumps(payload).encode("utf-8")
              requests = []
          
              def fake_urlopen(request, context=None, timeout=None):
                  requests.append(request.full_url)
                  return BytesIO(raw)
          
              monkeypatch.setattr("llmcapa.registry.urllib.request.urlopen", fake_urlopen)
              count = registry.fetch_github_catalog(
                  "vllm", cache_ttl=0, write_bundled=False
              )
              assert count == 3
              assert registry.get("local-only", provider="vllm").context_window == 1024
              assert registry.fetch_github_catalog(
                  "vllm", cache_ttl=86400, write_bundled=False
              ) == 3
              assert len(requests) == 1
          """
          tests.write_text(code, encoding="utf-8")
          
          PY
          python -m black src/llmcapa/registry.py tests/test_hf_overlay.py
          python -m ruff check --fix src/llmcapa/registry.py tests/test_hf_overlay.py
          python -m black src/llmcapa/registry.py tests/test_hf_overlay.py
          python -m black --check src/llmcapa/registry.py tests/test_hf_overlay.py
          python -m ruff check src/llmcapa/registry.py tests/test_hf_overlay.py
          python -m pytest -q tests/test_hf_overlay.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llmcapa/registry.py tests/test_hf_overlay.py
          git commit -m "fix: expand compact catalogs from GitHub and cached snapshots"
          git push origin HEAD:refs/heads/refactor/compact-local-catalogs-20261106
