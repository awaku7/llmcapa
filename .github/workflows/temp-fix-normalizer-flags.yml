name: Temporary fix normalizer flags

on:
  push:
    branches:
      - fix/foundry-local-catalog-metadata

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-catalog-metadata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch normalizer return semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_capability_normalizers.py')
          text = path.read_text(encoding='utf-8')

          old = '''    if merged == old:\n        return False\n    record["image"] = merged\n    if "image" in {str(x).lower() for x in record.get("input_modalities", [])}:\n        record["supports_vision"] = True\n    return True\n'''
          new = '''    block_changed = merged != old\n    if block_changed:\n        record["image"] = merged\n    top_changed = False\n    if (\n        "image" in {str(x).lower() for x in record.get("input_modalities", [])}\n        and record.get("supports_vision") is not True\n    ):\n        record["supports_vision"] = True\n        top_changed = True\n    return block_changed or top_changed\n'''
          if old not in text:
              raise SystemExit('image normalizer block not found')
          text = text.replace(old, new, 1)

          old = '''    if "decision" in {str(x).lower() for x in record.get("output_modalities", [])}:\n        record["supports_chat_completion"] = False\n    if merged == old:\n        return False\n    record["decision"] = merged\n    return True\n'''
          new = '''    top_changed = False\n    if (\n        "decision" in {str(x).lower() for x in record.get("output_modalities", [])}\n        and record.get("supports_chat_completion") is not False\n    ):\n        record["supports_chat_completion"] = False\n        top_changed = True\n    block_changed = merged != old\n    if block_changed:\n        record["decision"] = merged\n    return block_changed or top_changed\n'''
          if old not in text:
              raise SystemExit('decision normalizer block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_capability_normalizers.py')
          body = tests.read_text(encoding='utf-8')
          addition = '''\n\ndef test_image_top_level_flag_change_is_reported():\n    record = {\n        "provider": "test",\n        "model_id": "vision-chat",\n        "input_modalities": ["text", "image"],\n        "output_modalities": ["text"],\n        "supports_vision": False,\n        "image": {\n            "accepts_image_input": True,\n            "status": "inferred",\n            "checked_at": "2026-09-29",\n        },\n    }\n\n    assert normalize_image_record(record, checked_at="2026-09-29") is True\n    assert record["supports_vision"] is True\n\n\ndef test_decision_top_level_flag_change_is_reported():\n    record = {\n        "provider": "test",\n        "model_id": "typed-decision",\n        "input_modalities": ["text"],\n        "output_modalities": ["decision"],\n        "supports_chat_completion": True,\n        "decision": {\n            "decision": True,\n            "free_form_text": False,\n            "status": "inferred",\n            "checked_at": "2026-09-29",\n        },\n    }\n\n    assert normalize_decision_record(record, checked_at="2026-09-29") is True\n    assert record["supports_chat_completion"] is False\n'''
          if 'test_image_top_level_flag_change_is_reported' not in body:
              tests.write_text(body.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Validate focused changes
        run: |
          python -m pip install --upgrade black ruff pytest
          python -m black scripts/_capability_normalizers.py tests/test_capability_normalizers.py
          python -m ruff check scripts/_capability_normalizers.py tests/test_capability_normalizers.py
          python -m pytest -q tests/test_capability_normalizers.py
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fix-normalizer-flags.yml
          git add scripts/_capability_normalizers.py tests/test_capability_normalizers.py
          git diff --cached --check
          git commit -m "fix: persist normalized top-level modality flags"
          git push
