name: One-time provider refresh failure diagnostics
on:
  push:
    branches:
      - automation/catalog-refresh-42201846102
    paths:
      - .github/workflows/one-time-catalog-ci-diagnostics-20261107.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check main divergence
        run: |
          git fetch origin main
          git log --oneline --max-count=6 origin/main
          git diff --name-only HEAD..origin/main | head -40
      - name: Inspect regression data
        run: |
          python - <<'PY'
          import collections, json, pathlib
          d=pathlib.Path("src/llmcapa/data")
          a=json.loads((d/"azure_foundry.json").read_text())["models"]
          dupes=collections.defaultdict(list)
          for m in a:
              dupes[m["model_id"].casefold()].append(m)
          for k,v in dupes.items():
              if len(v)>1:
                  print("AZURE_DUPE",k,len(v), flush=True)
                  for x in v: print("AZURE_ITEM",json.dumps(x,ensure_ascii=False)[:4000],flush=True)
          c=json.loads((d/"cloudflare-workers-ai.json").read_text())["models"]
          for x in c:
              if x["model_id"]=="@cf/openai/gpt-oss-20b":
                  print("CLOUDFLARE",json.dumps(x,ensure_ascii=False)[:4000],flush=True)
          m=json.loads((d/"mdx-maas.json").read_text())["models"]
          print("MDX",len(m),[x["model_id"] for x in m],flush=True)
          r=json.loads(pathlib.Path("docs/catalog_refresh/latest.json").read_text())
          p=next(x for x in r["providers"] if x["provider"]=="inception")
          print("REPORT_INCEPTION",json.dumps({"status":p["status"],"mercury":p["changes"]["modified"].get("mercury-2.5")},ensure_ascii=False),flush=True)
          s=json.loads((d/"inception.json").read_text())["models"]
          for x in s:
              if x["model_id"]=="mercury-2.5":
                  print("MERCURY",json.dumps({"pricing":x["pricing"],"extra":x["extra"]},ensure_ascii=False)[:3500],flush=True)
          
          PY
