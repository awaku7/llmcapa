name: One-time Cloudflare metadata parser audit
on:
  push:
    branches:
      - automation/catalog-refresh-42201846102
    paths:
      - .github/workflows/one-time-cloudflare-parser-audit-20261107.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official model page layouts and regressions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          import _update_cloudflare_workers_ai as cf
          ids = (
              "@cf/zai-org/glm-5.3",
              "@cf/google/gemma-4-26b-a4b-it",
              "@cf/deepseek-ai/deepseek-v4.1-flash-1017",
              "@cf/cloudflare/clairic",
          )
          current = {m["model_id"]: m for m in json.loads(Path("src/llmcapa/data/cloudflare-workers-ai.json").read_text())["models"]}
          for mid in ids:
              model = current[mid]
              url = model["extra"]["official_model_source"]
              print("MODEL", mid, "URL", url, flush=True)
              try:
                  text = cf._fetch_text(url)
              except Exception as ex:
                  print("FETCH ERROR", repr(ex), flush=True)
                  continue
              loc = text.find(mid)
              print("RAW SIZE", len(text), "MARKER OFFSET", loc, "RAW NEAR MODEL", repr(text[max(0,loc-160):loc+850]), flush=True)
              print("LINE TAGS", cf._feature_tags(text, mid), flush=True)
              print("INFO ROWS", cf._model_info_rows(text), flush=True)
          PY
