name: One-time Black formatting for refresh runner

on:
  push:
    branches:
      - fix/ci-install-beautifulsoup4-20261106

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-install-beautifulsoup4-20261106
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format and check existing refresh code
        run: |
          python -m pip install black ruff==0.17.2 pytest
          python -m black scripts/refresh_catalogs.py tests/test_refresh_catalogs.py
          python -m black --check scripts/refresh_catalogs.py tests/test_refresh_catalogs.py
          python -m ruff check scripts/refresh_catalogs.py tests/test_refresh_catalogs.py
      - name: Commit formatted files to the fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/refresh_catalogs.py tests/test_refresh_catalogs.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format refresh runner and tests with Black"
            git push origin HEAD:fix/ci-install-beautifulsoup4-20261106
          fi
