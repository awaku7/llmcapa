name: One-time local inventory overlay regression repair
on:
  push:
    branches:
      - automation/catalog-refresh-42201846102
    paths:
      - .github/workflows/one-time-local-inventory-overlay-fix.yml
permissions:
  contents: write
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install -e . pytest black ruff==0.17.2 beautifulsoup4 requests playwright
      - name: Update both local inventory writers, validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          
          files = (
              ("scripts/provider_updates/lmstudio.py", "lmstudio"),
              ("scripts/provider_updates/llama_cpp.py", "llama-cpp"),
          )
          for filename, provider in files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              assert text.count("import os\n") == 1
              text = text.replace("import os\n", "import os\nimport sys\n")
              root = 'ROOT = Path(__file__).resolve().parents[2]\n'
              assert text.count(root) == 1
              text = text.replace(
                  root,
                  root + 'sys.path.insert(0, str(ROOT / "src"))\n'
                  + "from llmcapa.hf_overlay import expand_hf_overlay, is_hf_overlay, pack_hf_overlay\n",
              )
              old = '    data = json.loads(DATA.read_text(encoding="utf-8"))\n'
              new = '''    stored = json.loads(DATA.read_text(encoding="utf-8"))
              source = None
              if is_hf_overlay(stored):
                  source = json.loads(
                      (DATA.parent / "huggingface.json").read_text(encoding="utf-8")
                  )
                  data = expand_hf_overlay(source, stored)
              else:
                  data = stored
          '''
              assert text.count(old) == 1
              text = text.replace(old, new)
              old = '''    DATA.write_text(
                  json.dumps({**data, "models": models}, ensure_ascii=False, indent=2) + "\\n",
                  encoding="utf-8",
              )
          '''
              new = '''    updated = {**data, "models": models}
              if source is not None:
                  updated = pack_hf_overlay(source, updated, provider="''' + provider + '''")
              DATA.write_text(
                  json.dumps(updated, ensure_ascii=False, indent=2) + "\\n",
                  encoding="utf-8",
              )
          '''
              assert text.count(old) == 1
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          
          test = Path("tests/test_provider_inventory_refresh.py")
          original = test.read_text(encoding="utf-8")
          assert "test_local_inventory_overlay_update_keeps_new_and_previous_models" not in original
          test.write_text(
              original + '''
          
          
          def test_local_inventory_overlay_update_keeps_new_and_previous_models(
              tmp_path, monkeypatch
          ):
              import json
          
              from llmcapa.hf_overlay import (
                  expand_hf_overlay,
                  is_hf_overlay,
                  pack_hf_overlay,
              )
          
              source = {
                  "models": [
                      {"model_id": "org/present", "context_window": 8192},
                      {"model_id": "org/other", "context_window": 4096},
                  ]
              }
              (tmp_path / "huggingface.json").write_text(
                  json.dumps(source), encoding="utf-8"
              )
          
              for name, provider in (("lmstudio", "lmstudio"), ("llama_cpp", "llama-cpp")):
                  updater = _load_provider_update(name)
                  catalog_path = tmp_path / f"{name}.json"
                  monkeypatch.setattr(updater, "DATA", catalog_path)
                  original = {
                      "models": [
                          {
                              "provider": provider,
                              "model_id": "org/present",
                              "context_window": 8192,
                              "extra": {"hand_verified": True},
                          },
                          {
                              "provider": provider,
                              "model_id": "org/other",
                              "context_window": 4096,
                              "extra": {"retain": "yes"},
                          },
                          {
                              "provider": provider,
                              "model_id": "local-older",
                              "extra": {"local_only": True},
                          },
                      ]
                  }
                  catalog_path.write_text(
                      json.dumps(pack_hf_overlay(source, original, provider=provider)),
                      encoding="utf-8",
                  )
                  snapshots = [
                      {"model_id": "org/present", "display_name": "Installed model"},
                      {"model_id": "local-new", "display_name": "New installation"},
                  ]
                  assert (
                      updater.update_catalog(
                          snapshots, base_url="http://127.0.0.1:1234", checked_at="2026-11-07"
                      )
                      == 2
                  )
                  stored = json.loads(catalog_path.read_text(encoding="utf-8"))
                  assert is_hf_overlay(stored)
                  assert "models" not in stored
                  expanded = expand_hf_overlay(source, stored)["models"]
                  by_id = {model["model_id"]: model for model in expanded}
                  assert set(by_id) == {"org/present", "org/other", "local-new", "local-older"}
                  assert by_id["org/present"]["extra"]["hand_verified"] is True
                  assert by_id["org/present"]["display_name"] == "Installed model"
                  assert by_id["org/other"]["extra"]["retain"] == "yes"
                  assert by_id["local-older"]["extra"]["local_only"] is True
                  assert by_id["local-new"]["display_name"] == "New installation"
                  assert by_id["local-new"]["extra"]["model_server_base_url"] == (
                      "http://127.0.0.1:1234"
                  )
                  if name == "lmstudio":
                      missing_field = "not_listed_in_current_installation"
                  else:
                      missing_field = "not_listed_in_current_server"
                  assert by_id["org/other"]["extra"][missing_field] is True
                  assert by_id["local-older"]["extra"][missing_field] is True
          
                  # A second refresh must retain previous facts and the local-only IDs.
                  assert updater.update_catalog(
                      snapshots[:1],
                      base_url="http://127.0.0.1:1234",
                      checked_at="2026-11-08",
                  ) == 1
                  stored = json.loads(catalog_path.read_text(encoding="utf-8"))
                  by_id = {
                      model["model_id"]: model
                      for model in expand_hf_overlay(source, stored)["models"]
                  }
                  assert set(by_id) == {"org/present", "org/other", "local-new", "local-older"}
                  assert by_id["local-new"]["extra"][missing_field] is True
          
          
          def test_local_inventory_legacy_json_update_remains_supported(tmp_path, monkeypatch):
              import json
          
              for name, provider in (("lmstudio", "lmstudio"), ("llama_cpp", "llama-cpp")):
                  updater = _load_provider_update(name)
                  path = tmp_path / f"{name}.json"
                  monkeypatch.setattr(updater, "DATA", path)
                  path.write_text(
                      json.dumps(
                          {
                              "models": [
                                  {
                                      "provider": provider,
                                      "model_id": "existing",
                                      "extra": {"note": "preserve"},
                                  }
                              ]
                          }
                      ),
                      encoding="utf-8",
                  )
                  updater.update_catalog(
                      [{"model_id": "new", "display_name": "New"}],
                      base_url="http://localhost:1234",
                      checked_at="2026-11-07",
                  )
                  stored = json.loads(path.read_text(encoding="utf-8"))
                  assert "_format" not in stored
                  assert {row["model_id"] for row in stored["models"]} == {"existing", "new"}
                  assert next(
                      row for row in stored["models"] if row["model_id"] == "existing"
                  )["extra"]["note"] == "preserve"
          ''',
              encoding="utf-8",
          )
          print("LOCAL_INVENTORY_FIX_PREPARED", flush=True)
          
          PY
          python -m black scripts/provider_updates/lmstudio.py scripts/provider_updates/llama_cpp.py tests/test_provider_inventory_refresh.py
          python -m black --check scripts/provider_updates/lmstudio.py scripts/provider_updates/llama_cpp.py tests/test_provider_inventory_refresh.py
          python -m ruff check scripts/provider_updates/lmstudio.py scripts/provider_updates/llama_cpp.py tests/test_provider_inventory_refresh.py
          python -m pytest -q tests/test_provider_inventory_refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/provider_updates/lmstudio.py scripts/provider_updates/llama_cpp.py tests/test_provider_inventory_refresh.py
          git rm -f .github/workflows/one-time-local-inventory-overlay-fix.yml
          git commit -m "fix: update local inventory writers for compact HF overlays"
          git push origin HEAD:refs/heads/automation/catalog-refresh-42201846102
