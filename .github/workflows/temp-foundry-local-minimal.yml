name: Temporary Foundry Local minimal patch

on:
  push:
    branches:
      - fix/foundry-local-metadata-minimal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-metadata-minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Foundry Local updater and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_update_foundry_local.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          inserted_context_parse = False
          inserted_variant_context = False
          inserted_context_aggregate = False
          replaced_model_context = False
          inserted_license = False

          for line in lines:
              if line == '    max_output = _as_int(system.get("maxOutputTokens")) or _as_int(':
                  out.extend([
                      '    context_window = (',
                      '        _as_int(system.get("textContextWindow"))',
                      '        or _as_int(system.get("maxInputTokens"))',
                      '        or _as_int(tags.get("contextLength"))',
                      '        or _as_int(tags.get("maxInputTokens"))',
                      '    )',
                  ])
                  inserted_context_parse = True
              if line == '        "max_output_tokens": max_output,':
                  out.append('        "context_window": context_window,')
                  inserted_variant_context = True
              if line == '        max_outputs = [':
                  out.extend([
                      '        context_windows = [',
                      '            int(row["context_window"])',
                      '            for row in variants',
                      '            if isinstance(row.get("context_window"), int)',
                      '            and int(row["context_window"]) > 0',
                      '        ]',
                  ])
                  inserted_context_aggregate = True
              if line == '                "context_window": 0,':
                  line = '                "context_window": min(context_windows) if context_windows else 0,'
                  replaced_model_context = True
              if line == '                "pricing": None,':
                  out.append('                "license_type": licenses[0] if len(licenses) == 1 else "unknown",')
                  inserted_license = True
              out.append(line)

          assert all([
              inserted_context_parse,
              inserted_variant_context,
              inserted_context_aggregate,
              replaced_model_context,
              inserted_license,
          ])
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          test_path = Path('tests/test_foundry_local_static.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = '''

          def test_foundry_local_exposes_catalog_context_windows_and_licenses() -> None:
              models = llmcapa.list_models(provider="foundry-local")
              with_context = [model for model in models if model.context_window > 0]
              assert with_context
              assert llmcapa.find(provider="foundry-local", min_context_window=1)

              licensed = [model for model in models if model.extra.get("licenses")]
              assert licensed
              for model in licensed:
                  licenses = {
                      str(value).strip().lower()
                      for value in model.extra["licenses"]
                      if str(value).strip()
                  }
                  if len(licenses) == 1:
                      assert model.license_type.lower() == next(iter(licenses))


          def test_foundry_local_specialized_capabilities_are_postprocessed() -> None:
              models = llmcapa.list_models(provider="foundry-local")
              audio_models = [
                  model
                  for model in models
                  if "audio" in model.input_modalities or "audio" in model.output_modalities
              ]
              embedding_models = [
                  model
                  for model in models
                  if "embedding" in model.output_modalities
                  or "embeddings" in model.output_modalities
              ]
              assert audio_models
              assert embedding_models
              assert all(model.audio is not None for model in audio_models)
              assert all(model.embedding is not None for model in embedding_models)
          '''
          if 'test_foundry_local_exposes_catalog_context_windows_and_licenses' not in tests:
              test_path.write_text(tests.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Install tools
        run: python -m pip install -e . pytest black ruff
      - name: Refresh Foundry Local only
        shell: bash
        run: |
          python scripts/_update_foundry_local.py
          python - <<'PY'
          import shutil
          import tempfile
          from pathlib import Path
          from scripts._audio_capability_postprocess import apply as apply_audio
          from scripts._video_capability_postprocess import apply as apply_video
          from scripts._structured_capability_postprocess import apply as apply_structured
          from scripts._image_capability_postprocess import apply as apply_image

          source = Path('src/llmcapa/data/foundry_local.json')
          with tempfile.TemporaryDirectory() as tmp_name:
              tmp = Path(tmp_name)
              target = tmp / source.name
              shutil.copy2(source, target)
              apply_audio(tmp)
              apply_video(tmp)
              apply_structured(tmp)
              apply_image(tmp)
              shutil.copy2(target, source)
          PY
          git restore provider_update_log.md
      - name: Validate minimal patch
        run: |
          python -m black scripts/_update_foundry_local.py tests/test_foundry_local_static.py
          python -m black --check scripts/_update_foundry_local.py tests/test_foundry_local_static.py
          python -m ruff check scripts/_update_foundry_local.py tests/test_foundry_local_static.py
          python -m pytest tests/test_foundry_local_static.py
      - name: Commit minimal patch
        shell: bash
        run: |
          rm .github/workflows/temp-foundry-local-minimal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/_update_foundry_local.py src/llmcapa/data/foundry_local.json tests/test_foundry_local_static.py .github/workflows/temp-foundry-local-minimal.yml
          git commit -m "fix: scope Foundry Local metadata refresh"
          git push
